name: Recent activity
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-readme-with-activity:
    name: Update README with recent activity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and filter activity
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, time, urllib.request
          from datetime import datetime, timedelta, timezone

          username = "staskus"
          MIN_ITEMS = 5
          token = os.environ.get("GH_TOKEN", "")

          def auth_headers(accept="application/vnd.github+json"):
              h = {"Accept": accept, "User-Agent": username}
              if token:
                  h["Authorization"] = "token " + token
              return h

          fork_cache = {}

          def repo_is_fork(repo):
              if not repo:
                  return True
              if repo in fork_cache:
                  return fork_cache[repo]
              is_fork = True
              try:
                  req = urllib.request.Request(
                      "https://api.github.com/repos/" + repo,
                      headers=auth_headers()
                  )
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      is_fork = json.loads(resp.read()).get("fork", True)
              except Exception as e:
                  print("repo lookup failed for " + repo + ": " + str(e))
              fork_cache[repo] = is_fork
              return is_fork

          lines = []
          seen = set()

          def add_line(line):
              if line and line not in seen:
                  seen.add(line)
                  lines.append(str(len(lines) + 1) + ". " + line)

          # Stage 1: events API — recent reviews, comments, issues, pushes, PRs
          print("=== Stage 1: events API ===")
          for page in range(1, 11):
              if len(lines) >= MIN_ITEMS:
                  break
              url = ("https://api.github.com/users/" + username + "/events/public?per_page=100&page=" + str(page))
              try:
                  req = urllib.request.Request(url, headers=auth_headers())
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      page_events = json.loads(resp.read())
              except Exception as e:
                  print("events page " + str(page) + " error: " + str(e))
                  break
              if not page_events:
                  break
              for event in page_events:
                  if len(lines) >= MIN_ITEMS:
                      break
                  repo = event.get("repo", {}).get("name", "")
                  if not repo or repo.startswith(username + "/"):
                      continue
                  if repo_is_fork(repo):
                      continue
                  etype = event.get("type", "")
                  payload = event.get("payload", {})
                  if etype == "PullRequestReviewEvent":
                      pr = payload.get("pull_request", {})
                      num = pr.get("number", "")
                      url = pr.get("html_url", "") or ("https://github.com/" + repo + "/pull/" + str(num))
                      add_line("Reviewed PR [#" + str(num) + "](" + url + ") in [" + repo + "](https://github.com/" + repo + ")")
                  elif etype == "PullRequestEvent":
                      pr = payload.get("pull_request", {})
                      action = payload.get("action", "")
                      merged = pr.get("merged", False)
                      num = pr.get("number", "")
                      url = pr.get("html_url", "") or ("https://github.com/" + repo + "/pull/" + str(num))
                      if action == "closed" and merged:
                          add_line("Merged PR [#" + str(num) + "](" + url + ") in [" + repo + "](https://github.com/" + repo + ")")
                      elif action == "opened":
                          add_line("Opened PR [#" + str(num) + "](" + url + ") in [" + repo + "](https://github.com/" + repo + ")")
                  elif etype == "IssueCommentEvent":
                      issue = payload.get("issue", {})
                      num = issue.get("number", "")
                      url = (payload.get("comment", {}) or {}).get("html_url", "") or issue.get("html_url", "")
                      if url:
                          add_line("Commented on [#" + str(num) + "](" + url + ") in [" + repo + "](https://github.com/" + repo + ")")
                  elif etype == "IssuesEvent":
                      action = payload.get("action", "")
                      issue = payload.get("issue", {})
                      num = issue.get("number", "")
                      url = issue.get("html_url", "")
                      if action == "opened" and url:
                          add_line("Opened issue [#" + str(num) + "](" + url + ") in [" + repo + "](https://github.com/" + repo + ")")
                      elif action == "closed" and url:
                          add_line("Closed issue [#" + str(num) + "](" + url + ") in [" + repo + "](https://github.com/" + repo + ")")
                  elif etype == "PushEvent":
                      count = payload.get("size", 0)
                      ref = payload.get("ref", "").replace("refs/heads/", "")
                      add_line("Pushed " + str(count) + " commit" + ("s" if count != 1 else "") + " to " + ref + " in [" + repo + "](https://github.com/" + repo + ")")
              print("stage1 after page " + str(page) + ": " + str(len(lines)) + " lines")

          # Stage 2: PR search — authored PRs, expand timeframe until >= MIN_ITEMS
          print("=== Stage 2: PR search ===")
          if len(lines) < MIN_ITEMS:
              for days in [7, 30, 90, 180, 365]:
                  if len(lines) >= MIN_ITEMS:
                      break
                  since = (datetime.now(timezone.utc) - timedelta(days=days)).strftime("%Y-%m-%d")
                  print("days=" + str(days) + " since=" + since)
                  for page in range(1, 6):
                      if len(lines) >= MIN_ITEMS:
                          break
                      url = (
                          "https://api.github.com/search/issues"
                          "?q=author:" + username + "+type:pr+is:public+updated:>" + since
                          + "&per_page=50&page=" + str(page) + "&sort=updated&order=desc"
                      )
                      try:
                          req = urllib.request.Request(url, headers=auth_headers())
                          with urllib.request.urlopen(req, timeout=20) as resp:
                              data = json.loads(resp.read())
                      except Exception as e:
                          print("  PR search page " + str(page) + " error: " + str(e))
                          break
                      items = data.get("items", [])
                      print("  page " + str(page) + ": " + str(len(items)) + " items, total=" + str(data.get("total_count", 0)))
                      if not items:
                          break
                      for item in items:
                          if len(lines) >= MIN_ITEMS:
                              break
                          html = item.get("html_url", "")
                          parts = html.split("/")
                          repo = parts[3] + "/" + parts[4] if len(parts) > 4 else ""
                          if not repo or repo.startswith(username + "/"):
                              continue
                          if repo_is_fork(repo):
                              continue
                          num = item.get("number", "")
                          state = item.get("state", "")
                          merged_at = item.get("pull_request", {}).get("merged_at") if item.get("pull_request") else None
                          title = item.get("title", "")
                          if merged_at:
                              verb = "Merged"
                          elif state == "closed":
                              continue
                          else:
                              verb = "Opened"
                          add_line(verb + " PR [#" + str(num) + "](" + html + ") — " + title + " in [" + repo + "](https://github.com/" + repo + ")")
                      time.sleep(2)

          if not lines:
              print("No non-personal, non-fork activity found.")
              sys.exit(0)

          activity_text = "\n".join(lines)
          print("Activity:\n" + activity_text)

          with open("README.md", "r") as f:
              content = f.read()

          pattern = r"(<!--START_SECTION:activity-->).*?(<!--END_SECTION:activity-->)"
          replacement = r"\1" + "\n" + activity_text + "\n" + r"\2"
          content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open("README.md", "w") as f:
              f.write(content)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && exit 0
          git add README.md
          git commit -m "Update recent activity"
          git push